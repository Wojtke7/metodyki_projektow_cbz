<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="ProsteFakty to aplikacja, która ułatwia zrozumienie trudnych dokumentów urzędowych. Zamienia pisma, umowy i decyzje administracyjne na jasne wyjaśnienia: co oznaczają, co trzeba zrobić i których terminów trzeba dopilnować."
    />
    <meta name="application-name" content="ProsteFakty" />
    <meta name="theme-color" content="#f1f5fa" />
    <meta property="og:title" content="Proste Fakty" />
    <meta
      property="og:description"
      content="ProsteFakty to aplikacja, która ułatwia zrozumienie trudnych dokumentów urzędowych. Zamienia pisma, umowy i decyzje administracyjne na jasne wyjaśnienia: co oznaczają, co trzeba zrobić i których terminów trzeba dopilnować."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Proste Fakty" />
    <meta
      name="twitter:description"
      content="ProsteFakty to aplikacja, która ułatwia zrozumienie trudnych dokumentów urzędowych. Zamienia pisma, umowy i decyzje administracyjne na jasne wyjaśnienia: co oznaczają, co trzeba zrobić i których terminów trzeba dopilnować."
    />
    <title>Proste Fakty</title>
    <script>
      // Apply the theme before the app loads to avoid a light flash in dark mode.
      let savedTheme;
      try {
        savedTheme = localStorage.getItem("prostefakty-theme");
      } catch {}
      const dark =
        savedTheme === "dark" ||
        (savedTheme !== "light" &&
          matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.querySelector('meta[name="theme-color"]').content = dark
        ? "#090b10"
        : "#f1f5fa";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
