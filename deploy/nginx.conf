server {
    listen 80 default_server;
    server_name _;

    root /var/www/prostefakty;
    index index.html;

    # nginx does not know .mjs by default. Browsers refuse to load an ES module
    # (for example the pdf.js worker) unless it is served as JavaScript.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    # API (backend listens only on localhost)
    location ~ ^/(explain|health|docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }

    # React SPA
    location / {
        try_files $uri /index.html;
    }
}
